name: macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: brew install cmake ninja pkgconf nasm
      - run: scripts/build-macos
      - uses: actions/upload-artifact@v4
        with:
          name: Yapfast-macOS
          path: target/macos/*.zip
          if-no-files-found: error
