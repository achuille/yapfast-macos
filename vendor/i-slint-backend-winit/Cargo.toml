# cSpell: ignore adwaita arboard smithay webbrowser zbus
[package]
name = "i-slint-backend-winit"
description = "Winit backend for Slint"
categories = ["gui", "wasm"]
keywords = ["winit", "desktop", "gui", "ui", "accessibility"]
authors = ["Slint Developers <info@slint.dev>"]
edition = "2024"
homepage = "https://slint.dev"
license = "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"
repository = "https://github.com/slint-ui/slint"
rust-version = "1.95"
version = "1.19.0"
build = "build.rs"

[lib]
path = "lib.rs"

# Note, these features need to be kept in sync (along with their defaults) in
# the C++ crate's CMakeLists.txt
[features]
image-pixel-format-gray8 = [
  "i-slint-core/image-pixel-format-gray8",
  "i-slint-renderer-femtovg?/image-pixel-format-gray8",
  "i-slint-renderer-skia?/image-pixel-format-gray8",
  "i-slint-renderer-software?/image-pixel-format-gray8",
  "i-slint-renderer-anyrender?/image-pixel-format-gray8",
]
image-pixel-format-rgb565 = [
  "i-slint-core/image-pixel-format-rgb565",
  "i-slint-renderer-femtovg?/image-pixel-format-rgb565",
  "i-slint-renderer-skia?/image-pixel-format-rgb565",
  "i-slint-renderer-software?/image-pixel-format-rgb565",
  "i-slint-renderer-anyrender?/image-pixel-format-rgb565",
]
wayland = [
  "winit/wayland",
  "winit/wayland-csd-adwaita",
  "glutin?/wayland",
  "glutin-winit?/wayland",
  "dep:arboard",
  "dep:smithay-clipboard",
  "i-slint-renderer-skia?/wayland",
  "softbuffer?/wayland",
  "softbuffer?/wayland-dlopen",
]
x11 = [
  "winit/x11",
  "glutin?/x11",
  "glutin?/glx",
  "glutin-winit?/x11",
  "glutin-winit?/glx",
  "dep:arboard",
  "i-slint-renderer-skia?/x11",
  "softbuffer?/x11",
  "softbuffer?/x11-dlopen",
]
renderer-femtovg = [
  "i-slint-renderer-femtovg/opengl",
  "dep:glutin",
  "dep:glutin-winit",
  "windows/Win32_Graphics_OpenGL",
]
renderer-femtovg-wgpu = ["i-slint-renderer-femtovg/wgpu", "dep:i-slint-renderer-femtovg", "unstable-wgpu-30"]
renderer-skia = ["i-slint-renderer-skia/default"]
renderer-vello = ["dep:i-slint-renderer-anyrender", "i-slint-renderer-anyrender/vello", "unstable-wgpu-30"]
renderer-skia-opengl = ["renderer-skia", "i-slint-renderer-skia/opengl"]
renderer-skia-vulkan = ["renderer-skia", "i-slint-renderer-skia/vulkan"]
renderer-skia-software = ["i-slint-renderer-skia/softbuffer"]
renderer-software = [
  "dep:softbuffer",
  "dep:imgref",
  "dep:rgb",
  "dep:i-slint-renderer-software",
  "i-slint-renderer-software/std",
  "dep:bytemuck",
]
accessibility = ["dep:accesskit", "dep:accesskit_winit", "i-slint-core/accessibility-text"]
raw-window-handle-06 = ["i-slint-core/raw-window-handle-06"]
unstable-wgpu-29 = ["i-slint-core/unstable-wgpu-29", "i-slint-renderer-skia?/unstable-wgpu-29"]
unstable-wgpu-30 = [
  "i-slint-core/unstable-wgpu-30",
  "i-slint-renderer-femtovg?/unstable-wgpu-30",
  "i-slint-renderer-skia?/unstable-wgpu-30",
]
default = []

[dependencies]
i-slint-core = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", features = ["default"] }
i-slint-core-macros = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", features = ["default"] }
i-slint-common = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", features = ["default"] }

lyon_path = { version = "1.0", default-features = false }
pin-weak = "1"
scoped-tls-hkt = "0.1"
strum = { version = "0.28", default-features = false, features = ["derive"] }
winit = { version = "0.30.2", default-features = false, features = ["rwh_06"] }
raw-window-handle = { version = "0.6", features = ["alloc"] }
scopeguard = { version = "1.1.0", default-features = false }

# For the FemtoVG renderer
i-slint-renderer-femtovg = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", features = ["default"], optional = true }

# For the Skia renderer
i-slint-renderer-skia = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", optional = true }

# For the vello renderer
i-slint-renderer-anyrender = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", optional = true }

# For the software renderer
i-slint-renderer-software = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", optional = true }
softbuffer = { version = "0.4.4", default-features = false, optional = true }
imgref = { version = "1.6.1", optional = true }
rgb = { version = "0.8.27", optional = true }
bytemuck = { version = "1.13.1", optional = true, features = ["derive"] }
webbrowser = "1.2.0"
itertools = { version = "0.15" }

[target.'cfg(any(target_os = "macos", target_family = "windows"))'.dependencies]
muda = { version = "0.21.1", optional = true, default-features = false }
vtable = { version = "0.5.1", git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.72", default-features = false, features = ["HtmlInputElement", "HtmlCanvasElement", "Window", "Document", "Event", "EventTarget", "FocusEvent", "KeyboardEvent", "InputEvent", "CompositionEvent", "DomStringMap", "ClipboardEvent", "DataTransfer", "Node", "WebGlContextEvent"] }
wasm-bindgen = { version = "0.2" }

[target.'cfg(all(not(target_arch = "wasm32"), not(all(target_vendor = "apple", not(target_os = "macos")))))'.dependencies]
glutin = { version = "0.32.0", default-features = false, optional = true, features = ["egl", "wgl"] }
glutin-winit = { version = "0.5", optional = true, default-features = false, features = ["egl", "wgl"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true, default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
# The browser decodes images on the web; decode with the image and resvg crates elsewhere.
i-slint-core = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", features = ["image-decoders", "svg"] }

[target.'cfg(not(any(target_family = "windows", target_vendor = "apple", target_arch = "wasm32", target_os = "android")))'.dependencies]
# Use same version and executor as accesskit
zbus = { version = "5.14.0", default-features = false, features = ["async-io"] }
futures = { version = "0.3.31" }
# Clipboard, activated by the x11/wayland features: arboard for X11, smithay-clipboard on the
# winit Wayland connection, so it works without the privileged data-control protocol.
arboard = { version = "3.6", default-features = false, optional = true }
smithay-clipboard = { version = "0.7", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# To disable macOS automatic shortcut translation
objc2 = { version = "0.6.3" }
# For GL rendering
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSEvent", "NSView", "NSWindow", "NSResponder", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSString", "NSNotification", "NSOperation", "NSRunLoop", "NSObjCRuntime", "NSUserDefaults"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CADisplayLink"] }
block2 = "0.6.2"
arboard = { version = "3.6", default-features = false }

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
# Enable Skia by default on Apple platforms with iOS, etc. (but not macOS). See also enable_skia_renderer in build.rs
i-slint-renderer-skia = { version = "=1.19.0", default-features = false, git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", features = ["default"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6.3" }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSString", "NSNotification", "NSOperation", "NSGeometry", "NSRunLoop", "objc2-core-foundation"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIApplication", "UIScene", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UIScreen", "UIWindow", "UIWindowScene", "UIView", "UIViewAnimating", "UIViewPropertyAnimator", "UIResponder", "UIInterface", "UIPasteboard", "UITrait", "UITraitCollection", "UIFont", "UIFontDescriptor", "objc2-core-foundation", "objc2-quartz-core", "block2"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CADisplayLink", "CATransaction", "CAFrameRateRange"] }
# Match version in objc2
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading"] }
arboard = { version = "3.6", default-features = false }

[build-dependencies]
cfg_aliases = { version = "0.2.2" }

[dev-dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "unstable-winit-030"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", default-features = false }

[package.metadata.docs.rs]
features = ["wayland", "renderer-software", "raw-window-handle-06"]
rustdoc-args = ["--generate-link-to-definition"]

[[test]]
name = "menubar_borrow"
harness = false

# These create a window and run the event loop, so they need the main thread.
[[test]]
name = "hide_from_window_event"
harness = false

[[test]]
name = "hide_with_external_reference"
harness = false

[[test]]
name = "redraw_before_reshow"
harness = false

[[test]]
name = "initial_window_icon"
harness = false
required-features = ["x11", "renderer-software"]
